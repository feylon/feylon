<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-label="Terminal: Jamshid — Fullstack Engineer and Microservices Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="1" stop-color="#1b1745"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00dc82"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#00dc82"/>
    </linearGradient>
    <clipPath id="c1"><rect x="76" y="70" height="24" width="0"><animate attributeName="width" from="0" to="180" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="76" y="122" height="24" width="0"><animate attributeName="width" from="0" to="180" begin="1.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c11"><rect x="76" y="330" height="24" width="0"><animate attributeName="width" from="0" to="180" begin="3.8s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <style>
      text { font-family: "Fira Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 16px; fill: #e2e8f0; white-space: pre; }
      .p  { fill: #00dc82; font-weight: 700; }
      .d  { fill: #38bdf8; font-weight: 700; }
      .k  { fill: #7dd3fc; }
      .s  { fill: #c4b5fd; }
      .m  { fill: #64748b; }
      .g  { fill: #00dc82; }
      .v  { fill: #a78bfa; }
      .b  { font-weight: 700; }
      .f  { opacity: 0; animation: in .35s ease-out forwards; }
      .cur { fill: #00dc82; opacity: 0; animation: in 0s 5.3s forwards, blink 1s steps(1) 5.3s infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes in    { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: .35; } }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="858" height="468" rx="14" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="2" y="2" width="856" height="36" rx="13" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="26" cy="20" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6.5" fill="#28c840"/>
  <text x="430" y="25" text-anchor="middle" class="m" style="font-size:13px">jamshid@feylon: ~</text>

  <!-- 1: whoami -->
  <text x="32" y="88" class="p">➜</text><text x="52" y="88" class="d">~</text>
  <text x="76" y="88" clip-path="url(#c1)">whoami</text>

  <!-- 2 -->
  <text x="32" y="114" class="f" style="animation-delay:1.1s"><tspan class="b">Jamshid</tspan><tspan class="m"> — </tspan>Fullstack Engineer <tspan class="m">&amp;</tspan> Microservices Architect</text>

  <!-- 3: cat -->
  <text x="32" y="140" class="p">➜</text><text x="52" y="140" class="d">~</text>
  <text x="76" y="140" clip-path="url(#c3)">cat stack.json</text>

  <!-- 4–10: json -->
  <text x="32" y="166" class="f m" style="animation-delay:2.5s">{</text>
  <text x="32" y="192" class="f" style="animation-delay:2.65s">  <tspan class="k">"frontend"</tspan>: [<tspan class="s">"Nuxt.js"</tspan>, <tspan class="s">"Vue 3"</tspan>, <tspan class="s">"Next.js"</tspan>, <tspan class="s">"Tailwind"</tspan>],</text>
  <text x="32" y="218" class="f" style="animation-delay:2.8s">  <tspan class="k">"backend"</tspan>:  [<tspan class="s">"NestJS"</tspan>, <tspan class="s">"Node.js"</tspan>, <tspan class="s">"FastAPI"</tspan>, <tspan class="s">"gRPC"</tspan>],</text>
  <text x="32" y="244" class="f" style="animation-delay:2.95s">  <tspan class="k">"data"</tspan>:     [<tspan class="s">"PostgreSQL"</tspan>, <tspan class="s">"MongoDB"</tspan>, <tspan class="s">"Redis"</tspan>, <tspan class="s">"ClickHouse"</tspan>],</text>
  <text x="32" y="270" class="f" style="animation-delay:3.1s">  <tspan class="k">"events"</tspan>:   [<tspan class="s">"Kafka"</tspan>, <tspan class="s">"RabbitMQ"</tspan>, <tspan class="s">"BullMQ"</tspan>, <tspan class="s">"WebSockets"</tspan>],</text>
  <text x="32" y="296" class="f" style="animation-delay:3.25s">  <tspan class="k">"infra"</tspan>:    [<tspan class="s">"Docker"</tspan>, <tspan class="s">"Nginx"</tspan>, <tspan class="s">"Linux"</tspan>, <tspan class="s">"CI/CD"</tspan>]</text>
  <text x="32" y="322" class="f m" style="animation-delay:3.4s">}</text>

  <!-- 11: status -->
  <text x="32" y="348" class="p">➜</text><text x="52" y="348" class="d">~</text>
  <text x="76" y="348" clip-path="url(#c11)">./status --now</text>

  <!-- 12–13 -->
  <g class="f" style="animation-delay:4.7s">
    <circle cx="38" cy="368" r="5" class="g pulse"/>
    <text x="52" y="374">building <tspan class="g b">event-driven microservices</tspan> in Tashkent 🇺🇿</text>
  </g>
  <g class="f" style="animation-delay:4.95s">
    <circle cx="38" cy="394" r="5" class="v pulse" style="animation-delay:1s"/>
    <text x="52" y="400">open to <tspan class="v b">remote &amp; freelance</tspan> opportunities 🚀</text>
  </g>

  <!-- 14: prompt + cursor -->
  <g class="f" style="animation-delay:5.3s">
    <text x="32" y="438" class="p">➜</text><text x="52" y="438" class="d">~</text>
  </g>
  <rect x="76" y="423" width="10" height="19" class="cur"/>
</svg>
